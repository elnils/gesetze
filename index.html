<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesetze.de – Deutsches Recht durchsuchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:       #1a1a18;
      --ink-2:     #4a4a42;
      --ink-3:     #8a8a7a;
      --paper:     #f5f2eb;
      --paper-2:   #ede9de;
      --paper-3:   #e2ddd0;
      --accent:    #c0392b;
      --accent-2:  #922b21;
      --gold:      #9a7d3a;
      --border:    rgba(26,26,24,.12);
      --shadow:    0 2px 16px rgba(26,26,24,.08);
      --ff-serif:  "Source Serif 4", Georgia, serif;
      --ff-display:"Playfair Display", serif;
      --ff-mono:   "IBM Plex Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ff-serif);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.7;
    }

    /* ── Header ── */
    header {
      border-bottom: 2px solid var(--ink);
      padding: 2rem 0 1.5rem;
      text-align: center;
      position: relative;
    }
    header::before {
      content: "";
      display: block;
      height: 4px;
      background: var(--accent);
      position: absolute;
      top: 0; left: 0; right: 0;
    }
    .header-eyebrow {
      font-family: var(--ff-mono);
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: .6rem;
    }
    h1 {
      font-family: var(--ff-display);
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    h1 span { color: var(--accent); }
    .header-sub {
      font-size: .9rem;
      color: var(--ink-2);
      margin-top: .5rem;
    }
    #last-updated {
      font-family: var(--ff-mono);
      font-size: .68rem;
      color: var(--ink-3);
      margin-top: .4rem;
    }

    /* ── Layout ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Suchfeld ── */
    .search-wrap {
      margin: 2rem 0 1.5rem;
      position: relative;
    }
    #search-input {
      width: 100%;
      padding: .9rem 1.2rem .9rem 3.2rem;
      font-family: var(--ff-serif);
      font-size: 1.05rem;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 0;
      outline: none;
      color: var(--ink);
      transition: border-color .2s;
      box-shadow: var(--shadow);
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--ink-3); font-style: italic; }
    .search-icon {
      position: absolute;
      left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--ink-3);
      pointer-events: none;
      font-size: 1.1rem;
    }
    .search-meta {
      font-family: var(--ff-mono);
      font-size: .72rem;
      color: var(--ink-3);
      margin-top: .5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    /* ── Filter-Chips ── */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-bottom: 1.5rem;
    }
    .chip {
      font-family: var(--ff-mono);
      font-size: .7rem;
      letter-spacing: .06em;
      padding: .3rem .8rem;
      border: 1px solid var(--border);
      background: var(--paper-2);
      cursor: pointer;
      transition: all .15s;
      user-select: none;
    }
    .chip:hover, .chip.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .chip.active { background: var(--accent); border-color: var(--accent); }

    /* ── Ergebnis-Liste ── */
    #results { }

    .result-item {
      border-top: 1px solid var(--border);
      padding: 1.2rem 0;
      cursor: pointer;
      transition: background .15s;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .6rem 1rem;
    }
    .result-item:hover { background: var(--paper-2); padding-left: .8rem; margin-left: -.8rem; }
    .result-norm {
      font-family: var(--ff-mono);
      font-size: .82rem;
      font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
      padding-top: .1rem;
    }
    .result-title {
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
    }
    .result-gesetz {
      font-family: var(--ff-mono);
      font-size: .68rem;
      color: var(--ink-3);
      letter-spacing: .06em;
      text-transform: uppercase;
      grid-column: 2;
    }
    .result-snippet {
      font-size: .88rem;
      color: var(--ink-2);
      line-height: 1.5;
      grid-column: 2;
      margin-top: .2rem;
    }
    .result-snippet mark {
      background: rgba(192,57,43,.12);
      color: var(--accent-2);
      padding: 0 .15rem;
    }

    /* ── Detail-Panel ── */
    #detail-panel {
      display: none;
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: min(560px, 100vw);
      background: #fff;
      border-left: 2px solid var(--ink);
      z-index: 100;
      flex-direction: column;
      box-shadow: -4px 0 32px rgba(26,26,24,.12);
    }
    #detail-panel.open { display: flex; }
    .panel-header {
      padding: 1.2rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .panel-norm {
      font-family: var(--ff-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }
    .panel-title {
      font-size: .95rem;
      color: var(--ink-2);
      margin-top: .2rem;
    }
    .panel-close {
      background: none;
      border: 1.5px solid var(--border);
      padding: .3rem .7rem;
      cursor: pointer;
      font-family: var(--ff-mono);
      font-size: .75rem;
      color: var(--ink-2);
      flex-shrink: 0;
      transition: all .15s;
    }
    .panel-close:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.4rem;
    }
    .panel-gesetztext {
      font-size: .93rem;
      line-height: 1.8;
      color: var(--ink);
      white-space: pre-wrap;
      border-left: 3px solid var(--paper-3);
      padding-left: 1rem;
      margin-bottom: 1.5rem;
    }

    /* ── KI-Chat ── */
    .ai-section {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
    }
    .ai-label {
      font-family: var(--ff-mono);
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .ai-label::before {
      content: "";
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }
    #chat-history {
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: .8rem;
    }
    .chat-msg {
      padding: .6rem .9rem;
      margin-bottom: .4rem;
      font-size: .88rem;
      line-height: 1.6;
      border-radius: 0;
    }
    .chat-msg.user {
      background: var(--paper-2);
      border-left: 3px solid var(--ink-3);
      color: var(--ink-2);
      font-style: italic;
    }
    .chat-msg.ai {
      background: rgba(154,125,58,.08);
      border-left: 3px solid var(--gold);
      color: var(--ink);
    }
    .chat-msg.error { border-left-color: var(--accent); background: rgba(192,57,43,.06); }
    .chat-input-row {
      display: flex;
      gap: .5rem;
    }
    #chat-input {
      flex: 1;
      padding: .55rem .8rem;
      font-family: var(--ff-serif);
      font-size: .88rem;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--ink);
      outline: none;
      resize: none;
    }
    #chat-input:focus { border-color: var(--gold); }
    #chat-send {
      padding: .55rem 1rem;
      background: var(--ink);
      color: var(--paper);
      border: none;
      font-family: var(--ff-mono);
      font-size: .75rem;
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    #chat-send:hover { background: var(--accent); }
    #chat-send:disabled { opacity: .4; cursor: default; }

    /* ── Leer / Lade ── */
    .state-empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ink-3);
    }
    .state-empty p { font-size: .92rem; margin-top: .5rem; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--ink-3);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #detail-panel { width: 100vw; border-left: none; border-top: 2px solid var(--ink); top: auto; height: 80vh; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-eyebrow">Deutsches &amp; Europäisches Recht</div>
  <h1>Gesetze<span>.</span>Repo</h1>
  <p class="header-sub">Durchsuche Bundesgesetze · beantworte Fragen mit KI</p>
  <div id="last-updated">Index wird geladen…</div>
</header>

<main>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="search" id="search-input"
      placeholder="§ 823 BGB · Datenschutz · Kündigung · Mietrecht …"
      autocomplete="off" spellcheck="false">
  </div>
  <div class="search-meta">
    <span id="result-count">–</span>
    <span id="index-stats"></span>
  </div>

  <div class="filter-row" id="filter-row">
    <!-- Chips werden dynamisch eingefügt -->
  </div>

  <div id="results">
    <div class="state-empty">
      <div style="font-size:2rem;margin-bottom:.5rem">§</div>
      <p>Suchbegriff eingeben, um Gesetze zu durchsuchen.</p>
    </div>
  </div>
</main>

<!-- Detail-Panel -->
<div id="detail-panel">
  <div class="panel-header">
    <div>
      <div class="panel-norm" id="panel-norm">–</div>
      <div class="panel-title" id="panel-title">–</div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕ Schließen</button>
  </div>
  <div class="panel-body">
    <div class="panel-gesetztext" id="panel-text">–</div>

    <div class="ai-section">
      <div class="ai-label">KI-Assistent (Groq)</div>
      <div id="chat-history"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="2"
          placeholder="Frage zum Paragraphen stellen …"></textarea>
        <button id="chat-send" onclick="sendChat()">Fragen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
// ─── Konfiguration ────────────────────────────────────────────────────────────
const INDEX_URL  = "./data/index.json";
const META_URL   = "./data/meta.json";
const GROQ_URL   = "https://gesetze-ki.n-hungerland.workers.dev";
const GROQ_MODEL = "llama-3.3-70b-versatile";

// ─── State ────────────────────────────────────────────────────────────────────
let fuse         = null;
let allData      = [];
let activeFilter = null;
let currentItem  = null;
let chatHistory  = [];

// ─── Index laden ──────────────────────────────────────────────────────────────
async function loadIndex() {
  try {
    const [indexRes, metaRes] = await Promise.all([
      fetch(INDEX_URL),
      fetch(META_URL).catch(() => null),
    ]);

    allData = await indexRes.json();

    fuse = new Fuse(allData, {
      keys: [
        { name: "bezeichnung", weight: 2 },
        { name: "titel",       weight: 1.5 },
        { name: "inhalt",      weight: 1 },
        { name: "gesetzName",  weight: 0.5 },
      ],
      threshold: 0.35,
      includeMatches: true,
      minMatchCharLength: 2,
    });

    if (metaRes) {
      const meta = await metaRes.json();
      document.getElementById("last-updated").textContent =
        "Stand: " + new Date(meta.generiert).toLocaleDateString("de-DE", {
          day: "2-digit", month: "long", year: "numeric",
        });
      document.getElementById("index-stats").textContent =
        `${meta.anzahl_eintraege.toLocaleString("de")} Paragraphen · ${meta.gesetze.length} Gesetze`;

      // Filter-Chips
      buildFilterChips(meta.gesetze);
    }

    document.getElementById("result-count").textContent = "Bereit.";
  } catch (e) {
    document.getElementById("last-updated").textContent =
      "Index nicht gefunden – bitte fetch.py ausführen.";
    console.error(e);
  }
}

// ─── Filter-Chips ─────────────────────────────────────────────────────────────
const CHIP_LABELS = {
  gg: "GG", bgb: "BGB", stgb: "StGB", hgb: "HGB", dsgvo: "DSGVO",
  bdsg_2018: "BDSG", estg: "EStG", uwg: "UWG", gwb: "GWB",
};

function buildFilterChips(gesetze) {
  const row = document.getElementById("filter-row");
  const priority = Object.keys(CHIP_LABELS);
  const sorted = [
    ...priority.filter(g => gesetze.includes(g)),
    ...gesetze.filter(g => !priority.includes(g)).sort(),
  ];

  row.innerHTML = "";
  sorted.slice(0, 16).forEach(g => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = CHIP_LABELS[g] || g.toUpperCase();
    chip.dataset.gesetz = g;
    chip.onclick = () => toggleFilter(g, chip);
    row.appendChild(chip);
  });
}

function toggleFilter(gesetz, chip) {
  if (activeFilter === gesetz) {
    activeFilter = null;
    chip.classList.remove("active");
  } else {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    activeFilter = gesetz;
    chip.classList.add("active");
  }
  doSearch(document.getElementById("search-input").value);
}

// ─── Suche ────────────────────────────────────────────────────────────────────
let searchTimeout = null;

document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(e.target.value), 200);
});

document.getElementById("search-input").addEventListener("keydown", e => {
  if (e.key === "Escape") closePanel();
});

function doSearch(query) {
  if (!fuse) return;

  const q = query.trim();
  if (!q && !activeFilter) {
    document.getElementById("results").innerHTML =
      `<div class="state-empty"><div style="font-size:2rem;margin-bottom:.5rem">§</div>
       <p>Suchbegriff eingeben, um Gesetze zu durchsuchen.</p></div>`;
    document.getElementById("result-count").textContent = "–";
    return;
  }

  let results;
  if (q) {
    results = fuse.search(q, { limit: 80 }).map(r => ({
      item: r.item, matches: r.matches,
    }));
  } else {
    results = allData.map(item => ({ item, matches: [] }));
  }

  if (activeFilter) {
    results = results.filter(r => r.item.gesetz === activeFilter);
  }

  document.getElementById("result-count").textContent =
    `${results.length} Treffer`;

  renderResults(results, q);
}

// ─── Ergebnisse rendern ───────────────────────────────────────────────────────
function highlight(text, query) {
  if (!query || !text) return text || "";
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(`(${escaped})`, "gi"),
    "<mark>$1</mark>");
}

function renderResults(results, query) {
  const container = document.getElementById("results");
  if (!results.length) {
    container.innerHTML =
      `<div class="state-empty"><p>Keine Treffer für <em>${query}</em>.</p></div>`;
    return;
  }

  container.innerHTML = results.slice(0, 60).map(({ item }) => `
    <div class="result-item" onclick="openPanel(${JSON.stringify(item).replace(/"/g, "&quot;")})">
      <div class="result-norm">${item.bezeichnung}</div>
      <div>
        <div class="result-title">${highlight(item.titel, query) || "<em>ohne Titel</em>"}</div>
        <div class="result-gesetz">${item.gesetzName || item.gesetz.toUpperCase()}</div>
        <div class="result-snippet">${highlight((item.inhalt || "").slice(0, 200), query)}…</div>
      </div>
    </div>
  `).join("");
}

// ─── Detail-Panel ─────────────────────────────────────────────────────────────
function openPanel(item) {
  currentItem = item;
  chatHistory = [];
  document.getElementById("chat-history").innerHTML = "";
  document.getElementById("panel-norm").textContent =
    `${item.bezeichnung} ${item.gesetzName || item.gesetz.toUpperCase()}`;
  document.getElementById("panel-title").textContent = item.titel || "";
  document.getElementById("panel-text").textContent  = item.inhalt || "(kein Volltext im Index)";
  document.getElementById("detail-panel").classList.add("open");
}

function closePanel() {
  document.getElementById("detail-panel").classList.remove("open");
  currentItem = null;
}

// ─── Groq KI-Chat ─────────────────────────────────────────────────────────────
document.getElementById("chat-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

async function sendChat() {
  const input  = document.getElementById("chat-input");
  const btn    = document.getElementById("chat-send");
  const q      = input.value.trim();

  if (!q) return;

  input.value = "";
  btn.disabled = true;
  addChatMsg(q, "user");

  // System-Prompt mit Kontext
  const systemPrompt = `Du bist ein juristischer Assistent für deutsches und europäisches Recht.
Aktueller Kontext:
Norm: ${currentItem?.bezeichnung} ${currentItem?.gesetzName || ""}
Titel: ${currentItem?.titel || ""}
Gesetzestext:
${(currentItem?.inhalt || "").slice(0, 3000)}

Antworte präzise und fachlich korrekt auf Deutsch. 
Zitiere Gesetzesstellen mit exakter Bezeichnung (z.B. § 823 Abs. 1 BGB).
Weise auf Rechtsunsicherheiten hin. 
Dies ist keine Rechtsberatung im Sinne des RDG.`;

  chatHistory.push({ role: "user", content: q });

  const loadingEl = addChatMsg(
    `<span class="spinner"></span>Analysiere…`, "ai"
  );

  try {
    const res = await fetch(GROQ_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [
          { role: "system", content: systemPrompt },
          ...chatHistory,
        ],
        max_tokens: 1024,
        temperature: 0.3,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data    = await res.json();
    const answer  = data.choices?.[0]?.message?.content || "(keine Antwort)";

    loadingEl.innerHTML = answer.replace(/\n/g, "<br>");
    chatHistory.push({ role: "assistant", content: answer });

  } catch (err) {
    loadingEl.innerHTML = `Fehler: ${err.message}`;
    loadingEl.className = "chat-msg error";
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function addChatMsg(html, role) {
  const history = document.getElementById("chat-history");
  const el = document.createElement("div");
  el.className = `chat-msg ${role}`;
  el.innerHTML = html;
  history.appendChild(el);
  history.scrollTop = history.scrollHeight;
  return el;
}

// ─── Start ────────────────────────────────────────────────────────────────────
loadIndex();
</script>
</body>
</html>
