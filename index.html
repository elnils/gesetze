<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesetze.de – Deutsches Recht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #1a1a18;
      --ink-2:      #4a4a42;
      --ink-3:      #8a8a7a;
      --paper:      #f5f2eb;
      --paper-2:    #ede9de;
      --paper-3:    #e2ddd0;
      --accent:     #c0392b;
      --gold:       #9a7d3a;
      --border:     rgba(26,26,24,.12);
      --shadow:     0 2px 20px rgba(26,26,24,.09);
      --ff-serif:   "Source Serif 4", Georgia, serif;
      --ff-display: "Playfair Display", serif;
      --ff-mono:    "IBM Plex Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff-serif);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.7;
    }

    /* ── Header ── */
    header {
      border-bottom: 2px solid var(--ink);
      padding: 1.4rem 0 1.2rem;
      text-align: center;
      position: relative;
    }
    header::before {
      content: ""; display: block; height: 4px;
      background: var(--accent);
      position: absolute; top: 0; left: 0; right: 0;
    }
    .header-eyebrow {
      font-family: var(--ff-mono); font-size: .68rem;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: .4rem;
    }
    h1 { font-family: var(--ff-display); font-size: clamp(1.6rem,4vw,2.6rem); font-weight: 600; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    #last-updated { font-family: var(--ff-mono); font-size: .65rem; color: var(--ink-3); margin-top: .3rem; }

    main { max-width: 860px; margin: 0 auto; padding: 1.8rem 1.25rem 4rem; }

    /* ── Search + AI Bar ── */
    .search-bar-wrap { position: relative; margin-bottom: .6rem; }
    .search-bar {
      display: flex; align-items: stretch;
      border: 2px solid var(--ink);
      background: #fff;
      box-shadow: var(--shadow);
      transition: border-color .2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar-icon {
      display: flex; align-items: center; padding: 0 1rem;
      font-size: 1.2rem; color: var(--ink-3); flex-shrink: 0;
    }
    #main-input {
      flex: 1; padding: .85rem .5rem;
      font-family: var(--ff-serif); font-size: 1rem;
      border: none; outline: none; background: transparent;
      color: var(--ink);
    }
    #main-input::placeholder { color: var(--ink-3); font-style: italic; }
    .search-bar-actions {
      display: flex; align-items: center; gap: .3rem; padding: .4rem .5rem; flex-shrink: 0;
    }
    .mode-btn {
      padding: .4rem .85rem;
      font-family: var(--ff-mono); font-size: .72rem; letter-spacing: .05em;
      border: 1.5px solid var(--border); background: var(--paper-2);
      cursor: pointer; transition: all .15s; white-space: nowrap; color: var(--ink-2);
    }
    .mode-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .mode-btn.ai-active { background: var(--gold); color: #fff; border-color: var(--gold); }
    #send-btn {
      padding: .4rem .9rem;
      font-family: var(--ff-mono); font-size: .72rem; letter-spacing: .05em;
      border: none; background: var(--accent); color: #fff;
      cursor: pointer; transition: background .15s;
    }
    #send-btn:hover { background: #a93226; }
    #send-btn:disabled { opacity: .4; cursor: default; }
    .search-meta {
      font-family: var(--ff-mono); font-size: .68rem; color: var(--ink-3);
      display: flex; gap: 1.2rem; margin-bottom: 1.2rem;
    }

    /* ── Filter Chips ── */
    .filter-row { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.4rem; }
    .chip {
      font-family: var(--ff-mono); font-size: .68rem; letter-spacing: .06em;
      padding: .28rem .75rem; border: 1px solid var(--border);
      background: var(--paper-2); cursor: pointer; transition: all .15s; user-select: none;
    }
    .chip:hover { background: var(--paper-3); }
    .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    /* ── KI-Antwort Box ── */
    #ai-answer-box {
      display: none;
      border: 2px solid var(--gold);
      background: #fff;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }
    #ai-answer-box.visible { display: block; }
    .ai-box-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: .7rem 1rem;
      border-bottom: 1px solid rgba(154,125,58,.2);
      background: rgba(154,125,58,.06);
    }
    .ai-box-label {
      font-family: var(--ff-mono); font-size: .68rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--gold);
      display: flex; align-items: center; gap: .5rem;
    }
    .ai-box-label::before {
      content: ""; display: inline-block; width: 7px; height: 7px;
      background: var(--gold); border-radius: 50%;
    }
    .ai-box-label.thinking::before { animation: pulse .8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .ai-clear-btn {
      font-family: var(--ff-mono); font-size: .68rem; background: none;
      border: 1px solid var(--border); padding: .2rem .6rem;
      cursor: pointer; color: var(--ink-3); transition: all .15s;
    }
    .ai-clear-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .ai-messages { padding: 1rem; max-height: 420px; overflow-y: auto; }
    .ai-msg { margin-bottom: 1rem; }
    .ai-msg:last-child { margin-bottom: 0; }
    .ai-msg.user {
      font-size: .9rem; color: var(--ink-2); font-style: italic;
      padding: .5rem .8rem; background: var(--paper-2);
      border-left: 3px solid var(--ink-3);
    }
    .ai-msg.assistant {
      font-size: .93rem; color: var(--ink); line-height: 1.75;
      border-left: 3px solid var(--gold); padding: .5rem .8rem;
      background: rgba(154,125,58,.04);
    }
    .ai-msg.assistant .sources {
      margin-top: .7rem; padding-top: .6rem;
      border-top: 1px solid rgba(154,125,58,.2);
      font-family: var(--ff-mono); font-size: .68rem; color: var(--ink-3);
    }
    .source-tag {
      display: inline-block; margin: .15rem .2rem;
      padding: .15rem .5rem; background: var(--paper-2);
      border: 1px solid var(--border); cursor: pointer; transition: all .12s;
    }
    .source-tag:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .ai-msg.error { border-left-color: var(--accent); background: rgba(192,57,43,.05); }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Suchergebnisse ── */
    #results { }
    .result-item {
      border-top: 1px solid var(--border); padding: 1.1rem 0;
      cursor: pointer; transition: all .15s;
      display: grid; grid-template-columns: auto 1fr; gap: .5rem 1rem;
    }
    .result-item:hover { background: var(--paper-2); padding-left: .7rem; margin-left: -.7rem; }
    .result-norm { font-family: var(--ff-mono); font-size: .8rem; font-weight: 500; color: var(--accent); white-space: nowrap; padding-top: .1rem; }
    .result-title { font-size: .97rem; color: var(--ink); }
    .result-gesetz { font-family: var(--ff-mono); font-size: .65rem; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; grid-column: 2; }
    .result-snippet { font-size: .86rem; color: var(--ink-2); line-height: 1.5; grid-column: 2; margin-top: .15rem; }
    .result-snippet mark { background: rgba(192,57,43,.12); color: #922b21; padding: 0 .12rem; }

    /* ── Detail Panel ── */
    #detail-panel {
      display: none; position: fixed;
      right: 0; top: 0; bottom: 0;
      width: min(520px, 100vw);
      background: #fff; border-left: 2px solid var(--ink);
      z-index: 100; flex-direction: column;
      box-shadow: -4px 0 32px rgba(26,26,24,.12);
    }
    #detail-panel.open { display: flex; }
    .panel-header {
      padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    }
    .panel-norm { font-family: var(--ff-display); font-size: 1.4rem; font-weight: 600; color: var(--accent); }
    .panel-title { font-size: .9rem; color: var(--ink-2); margin-top: .2rem; }
    .panel-close {
      background: none; border: 1.5px solid var(--border); padding: .3rem .7rem;
      cursor: pointer; font-family: var(--ff-mono); font-size: .72rem; color: var(--ink-2);
      flex-shrink: 0; transition: all .15s;
    }
    .panel-close:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .panel-body { flex: 1; overflow-y: auto; padding: 1.3rem; }
    .panel-text {
      font-size: .92rem; line-height: 1.85; color: var(--ink);
      white-space: pre-wrap; border-left: 3px solid var(--paper-3);
      padding-left: 1rem; margin-bottom: 1rem;
    }
    .panel-ask-btn {
      width: 100%; padding: .6rem;
      font-family: var(--ff-mono); font-size: .75rem; letter-spacing: .06em;
      background: var(--gold); color: #fff; border: none; cursor: pointer; transition: background .15s;
    }
    .panel-ask-btn:hover { background: #7d6430; }

    /* ── Empty / Info ── */
    .state-empty { text-align: center; padding: 3.5rem 1rem; color: var(--ink-3); }
    .state-empty .big { font-size: 2rem; margin-bottom: .5rem; }
    .state-empty p { font-size: .9rem; }
    .hint-examples { margin-top: 1.2rem; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
    .hint-chip {
      font-family: var(--ff-mono); font-size: .7rem; padding: .3rem .8rem;
      border: 1px solid var(--border); background: var(--paper-2);
      cursor: pointer; transition: all .15s; color: var(--ink-2);
    }
    .hint-chip:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

    @media (max-width:600px) {
      #detail-panel { width:100vw; border-left:none; top:auto; height:80vh; border-top:2px solid var(--ink); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-eyebrow">Deutsches &amp; Europäisches Recht</div>
  <h1>Gesetze<span>.</span>Repo</h1>
  <div id="last-updated">Lade Index…</div>
</header>

<main>

  <!-- ── Unified Search + AI Bar ── -->
  <div class="search-bar-wrap" style="margin-top:1.6rem">
    <div class="search-bar">
      <div class="search-bar-icon">⌕</div>
      <input type="text" id="main-input"
        placeholder="Frage stellen oder Paragraph suchen…"
        autocomplete="off" spellcheck="false">
      <div class="search-bar-actions">
        <button class="mode-btn" id="mode-search" onclick="setMode('search')">Suche</button>
        <button class="mode-btn ai-active" id="mode-ai" onclick="setMode('ai')">KI</button>
        <button id="send-btn" onclick="handleSubmit()">→</button>
      </div>
    </div>
  </div>

  <div class="search-meta">
    <span id="result-count">–</span>
    <span id="index-stats"></span>
  </div>

  <!-- ── Filter Chips ── -->
  <div class="filter-row" id="filter-row"></div>

  <!-- ── KI-Antwort ── -->
  <div id="ai-answer-box">
    <div class="ai-box-header">
      <div class="ai-box-label" id="ai-label">KI-Assistent · Groq</div>
      <button class="ai-clear-btn" onclick="clearChat()">✕ Löschen</button>
    </div>
    <div class="ai-messages" id="ai-messages"></div>
  </div>

  <!-- ── Suchergebnisse ── -->
  <div id="results">
    <div class="state-empty">
      <div class="big">§</div>
      <p>Stelle eine Rechtsfrage oder suche nach Paragraphen.</p>
      <div class="hint-examples">
        <span class="hint-chip" onclick="askExample(this)">Wann hafte ich für Schäden?</span>
        <span class="hint-chip" onclick="askExample(this)">Kündigungsschutz Arbeitnehmer</span>
        <span class="hint-chip" onclick="askExample(this)">§ 823 BGB</span>
        <span class="hint-chip" onclick="askExample(this)">Datenschutz Einwilligung</span>
        <span class="hint-chip" onclick="askExample(this)">GmbH Geschäftsführer Haftung</span>
        <span class="hint-chip" onclick="askExample(this)">Mietminderung Voraussetzungen</span>
      </div>
    </div>
  </div>

</main>

<!-- ── Detail Panel ── -->
<div id="detail-panel">
  <div class="panel-header">
    <div>
      <div class="panel-norm" id="panel-norm">–</div>
      <div class="panel-title" id="panel-title">–</div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="panel-text" id="panel-text">–</div>
    <button class="panel-ask-btn" onclick="askAboutCurrent()">
      Diese Norm mit KI erklären →
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const INDEX_URL  = "data/index.json";
const META_URL   = "data/meta.json";
const WORKER_URL = "https://ki-gesetze.tageslage.workers.dev";
const GROQ_MODEL = "llama-3.3-70b-versatile";
const MAX_CONTEXT_CHARS = 800;   // Zeichen pro Paragraph → Token sparen
const MAX_CONTEXT_NORMS = 5;     // Max Paragraphen als Kontext

// ─── State ───────────────────────────────────────────────────────────────────
let fuse         = null;
let allData      = [];
let activeFilter = null;
let currentMode  = "ai";         // "ai" | "search"
let chatHistory  = [];
let currentItem  = null;

// ─── Index laden ─────────────────────────────────────────────────────────────
async function loadIndex() {
  try {
    const [idxRes, metaRes] = await Promise.all([
      fetch(INDEX_URL),
      fetch(META_URL).catch(() => null),
    ]);
    allData = await idxRes.json();
    fuse = new Fuse(allData, {
      keys: [
        { name: "bezeichnung", weight: 2.5 },
        { name: "titel",       weight: 1.8 },
        { name: "inhalt",      weight: 1   },
        { name: "gesetzName",  weight: 0.5 },
      ],
      threshold: 0.35,
      includeMatches: true,
      minMatchCharLength: 2,
    });
    if (metaRes) {
      const meta = await metaRes.json();
      document.getElementById("last-updated").textContent =
        "Stand: " + new Date(meta.generiert).toLocaleDateString("de-DE",
          { day:"2-digit", month:"long", year:"numeric" });
      document.getElementById("index-stats").textContent =
        `${meta.anzahl_eintraege.toLocaleString("de")} Paragraphen · ${meta.gesetze.length} Gesetze`;
      buildChips(meta.gesetze);
    }
    document.getElementById("result-count").textContent = "Bereit";
  } catch(e) {
    document.getElementById("last-updated").textContent =
      "Index nicht gefunden – bitte fetch.py ausführen";
  }
}

// ─── Modus ───────────────────────────────────────────────────────────────────
function setMode(m) {
  currentMode = m;
  document.getElementById("mode-search").className =
    "mode-btn" + (m === "search" ? " active" : "");
  document.getElementById("mode-ai").className =
    "mode-btn" + (m === "ai" ? " ai-active" : "");
  const inp = document.getElementById("main-input");
  inp.placeholder = m === "ai"
    ? "Rechtsfrage stellen… z.B. \"Wann hafte ich als Geschäftsführer?\""
    : "Paragraph suchen… z.B. § 823 oder Kündigung";
  inp.focus();
}

// ─── Submit ──────────────────────────────────────────────────────────────────
function handleSubmit() {
  const q = document.getElementById("main-input").value.trim();
  if (!q) return;
  if (currentMode === "ai") {
    askAI(q);
  } else {
    doSearch(q);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("main-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); handleSubmit(); }
    if (e.key === "Escape") closePanel();
  });
  // Live-Suche nur im Such-Modus
  document.getElementById("main-input").addEventListener("input", e => {
    if (currentMode === "search") doSearch(e.target.value);
  });
});

// ─── Beispiel-Chips ──────────────────────────────────────────────────────────
function askExample(el) {
  const q = el.textContent;
  document.getElementById("main-input").value = q;
  setMode("ai");
  askAI(q);
}

// ─── Filter Chips ────────────────────────────────────────────────────────────
const CHIP_LABELS = { gg:"GG", bgb:"BGB", stgb:"StGB", hgb:"HGB",
  bdsg_2018:"BDSG", estg:"EStG", uwg:"UWG", gwb:"GWB", urhg:"UrhG" };

function buildChips(gesetze) {
  const row = document.getElementById("filter-row");
  const prio = Object.keys(CHIP_LABELS);
  const sorted = [
    ...prio.filter(g => gesetze.includes(g)),
    ...gesetze.filter(g => !prio.includes(g)).sort(),
  ];
  row.innerHTML = sorted.slice(0, 14).map(g => `
    <button class="chip" data-g="${g}" onclick="toggleFilter('${g}',this)">
      ${CHIP_LABELS[g] || g.toUpperCase()}
    </button>`).join("");
}

function toggleFilter(g, el) {
  activeFilter = activeFilter === g ? null : g;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  if (activeFilter) el.classList.add("active");
  const q = document.getElementById("main-input").value.trim();
  if (q || activeFilter) doSearch(q);
}

// ─── Suche ───────────────────────────────────────────────────────────────────
function doSearch(query) {
  if (!fuse) return;
  const q = query.trim();
  if (!q && !activeFilter) {
    showEmpty(); return;
  }
  let results = q
    ? fuse.search(q, { limit: 80 }).map(r => ({ item: r.item, matches: r.matches }))
    : allData.map(item => ({ item, matches: [] }));
  if (activeFilter) results = results.filter(r => r.item.gesetz === activeFilter);
  document.getElementById("result-count").textContent = `${results.length} Treffer`;
  renderResults(results, q);
}

function highlight(text, query) {
  if (!query || !text) return text || "";
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(`(${esc})`, "gi"), "<mark>$1</mark>");
}

function renderResults(results, query) {
  const c = document.getElementById("results");
  if (!results.length) {
    c.innerHTML = `<div class="state-empty"><p>Keine Treffer für <em>${query}</em></p></div>`;
    return;
  }
  c.innerHTML = results.slice(0, 60).map(({ item }) => `
    <div class="result-item" onclick='openPanel(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
      <div class="result-norm">${item.bezeichnung}</div>
      <div>
        <div class="result-title">${highlight(item.titel, query) || "<em>–</em>"}</div>
        <div class="result-gesetz">${item.gesetzName || item.gesetz.toUpperCase()}</div>
        <div class="result-snippet">${highlight((item.inhalt||"").slice(0,200), query)}…</div>
      </div>
    </div>`).join("");
}

function showEmpty() {
  document.getElementById("results").innerHTML = `
    <div class="state-empty">
      <div class="big">§</div>
      <p>Stelle eine Rechtsfrage oder suche nach Paragraphen.</p>
      <div class="hint-examples">
        <span class="hint-chip" onclick="askExample(this)">Wann hafte ich für Schäden?</span>
        <span class="hint-chip" onclick="askExample(this)">Kündigungsschutz Arbeitnehmer</span>
        <span class="hint-chip" onclick="askExample(this)">§ 823 BGB</span>
        <span class="hint-chip" onclick="askExample(this)">Datenschutz Einwilligung</span>
        <span class="hint-chip" onclick="askExample(this)">GmbH Geschäftsführer Haftung</span>
        <span class="hint-chip" onclick="askExample(this)">Mietminderung Voraussetzungen</span>
      </div>
    </div>`;
  document.getElementById("result-count").textContent = "–";
}

// ─── KI-Suche: relevante Paragraphen als Kontext ──────────────────────────────
function getContext(query) {
  if (!fuse) return { text: "", sources: [] };
  const results = fuse.search(query, { limit: MAX_CONTEXT_NORMS });
  if (!results.length) return { text: "", sources: [] };

  const sources = results.map(r => ({
    bezeichnung: r.item.bezeichnung,
    gesetzName:  r.item.gesetzName,
    gesetz:      r.item.gesetz,
    titel:       r.item.titel,
    item:        r.item,
  }));

  const text = results.map(r => {
    const p = r.item;
    const inhalt = (p.inhalt || "").slice(0, MAX_CONTEXT_CHARS);
    return `${p.bezeichnung} ${p.gesetzName} – ${p.titel}\n${inhalt}`;
  }).join("\n\n---\n\n");

  return { text, sources };
}

// ─── KI-Chat ─────────────────────────────────────────────────────────────────
async function askAI(question) {
  const box = document.getElementById("ai-answer-box");
  const msgs = document.getElementById("ai-messages");
  const btn  = document.getElementById("send-btn");
  const label = document.getElementById("ai-label");

  box.classList.add("visible");
  btn.disabled = true;

  // Nutzer-Nachricht anzeigen
  addMsg(question, "user");
  chatHistory.push({ role: "user", content: question });

  // Kontext aus Index holen (Token-sparend)
  const { text: ctxText, sources } = getContext(question);

  const systemPrompt = `Du bist ein juristischer Assistent für deutsches und europäisches Recht.
Antworte präzise auf Deutsch. Zitiere Normen exakt (z.B. § 823 Abs. 1 BGB, Art. 6 Abs. 1 DSGVO).
Weise auf Rechtsunsicherheiten hin. Dies ersetzt keine Rechtsberatung (RDG).

${ctxText ? `Relevante Normen aus dem Index:\n\n${ctxText}` : "Antworte auf Basis deines allgemeinen Rechtswissens."}`;

  // Lade-Indikator
  label.className = "ai-box-label thinking";
  label.innerHTML = `<span></span>KI denkt…`;
  const loadEl = addMsg(`<span class="spinner"></span>Analysiere relevante Normen…`, "assistant");

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: GROQ_MODEL,
        max_tokens: 1024,
        temperature: 0.25,
        messages: [
          { role: "system", content: systemPrompt },
          ...chatHistory.slice(-6), // max 6 Nachrichten History
        ],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data   = await res.json();
    const answer = data.choices?.[0]?.message?.content || "(keine Antwort)";

    // Antwort rendern mit Quellenangaben
    let html = answer.replace(/\n/g, "<br>");
    if (sources.length) {
      html += `<div class="sources">Verwendete Normen: ${
        sources.map(s =>
          `<span class="source-tag" onclick='openPanel(${JSON.stringify(s.item).replace(/'/g,"&#39;")})'>${s.bezeichnung} ${s.gesetz.toUpperCase()}</span>`
        ).join("")
      }</div>`;
    }
    loadEl.className = "ai-msg assistant";
    loadEl.innerHTML = html;

    chatHistory.push({ role: "assistant", content: answer });

    // Auch Suchergebnisse anzeigen
    if (fuse) doSearch(question);

  } catch(err) {
    loadEl.className = "ai-msg assistant error";
    loadEl.textContent = `Fehler: ${err.message}`;
  } finally {
    btn.disabled = false;
    label.className = "ai-box-label";
    label.innerHTML = `KI-Assistent · Groq`;
    document.getElementById("main-input").value = "";
    msgs.scrollTop = msgs.scrollHeight;
  }
}

function addMsg(html, role) {
  const msgs = document.getElementById("ai-messages");
  const el = document.createElement("div");
  el.className = `ai-msg ${role}`;
  el.innerHTML = html;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

function clearChat() {
  chatHistory = [];
  document.getElementById("ai-messages").innerHTML = "";
  document.getElementById("ai-answer-box").classList.remove("visible");
  showEmpty();
}

// ─── Detail Panel ─────────────────────────────────────────────────────────────
function openPanel(item) {
  currentItem = item;
  document.getElementById("panel-norm").textContent =
    `${item.bezeichnung} ${item.gesetzName || item.gesetz.toUpperCase()}`;
  document.getElementById("panel-title").textContent = item.titel || "";
  document.getElementById("panel-text").textContent  = item.inhalt || "(kein Volltext)";
  document.getElementById("detail-panel").classList.add("open");
}

function closePanel() {
  document.getElementById("detail-panel").classList.remove("open");
  currentItem = null;
}

function askAboutCurrent() {
  if (!currentItem) return;
  closePanel();
  const q = `Erkläre ${currentItem.bezeichnung} ${currentItem.gesetzName} – ${currentItem.titel}`;
  document.getElementById("main-input").value = q;
  setMode("ai");
  askAI(q);
}

// ─── Start ────────────────────────────────────────────────────────────────────
loadIndex();
setMode("ai");
</script>
