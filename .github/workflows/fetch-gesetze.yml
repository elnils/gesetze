name: Datenbank aktualisieren

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      was:
        description: "Was laden?"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - laws
          - cases
          - eu
          - alle

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Test (GG + BGB + StGB)
        if: ${{ github.event.inputs.was == 'test' }}
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"laws":["GG","BGB","StGB"]}' \
            "https://ki-gesetze.tageslage.workers.dev/fetch/laws"

      - name: Gesetze laden
        if: ${{ github.event.inputs.was == 'laws' || github.event.inputs.was == 'alle' || github.event_name == 'schedule' }}
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://ki-gesetze.tageslage.workers.dev/fetch/laws"

      - name: Urteile laden
        if: ${{ github.event.inputs.was == 'cases' || github.event.inputs.was == 'alle' || github.event_name == 'schedule' }}
        run: |
          curl -s -X POST \
            "https://ki-gesetze.tageslage.workers.dev/fetch/cases"

      - name: EU-Recht laden
        if: ${{ github.event.inputs.was == 'eu' || github.event.inputs.was == 'alle' }}
        run: |
          curl -s -X POST \
            "https://ki-gesetze.tageslage.workers.dev/fetch/eu"

      - name: Zusammenfassung
        run: |
          echo "## Ergebnis" >> $GITHUB_STEP_SUMMARY
          echo "- Abgeschlossen: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Daten in Cloudflare D1" >> $GITHUB_STEP_SUMMARY
