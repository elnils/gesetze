name: Gesetze aktualisieren

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Schnelltest – nur GG + BGB + StGB (~1 Min)"
        type: boolean
        required: false
        default: false
      gesetz:
        description: "Nur dieses Gesetz laden (z.B. bgb). Leer = Starter-Set (~30 Gesetze)"
        required: false
        default: ""
      full_update:
        description: "Alle ~6000 Gesetze laden (dauert lange)"
        type: boolean
        required: false
        default: false
      mit_urteilen:
        description: "Zusätzlich Urteile von OpenJur laden"
        type: boolean
        required: false
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gesetze → D1 laden
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scripts/fetch_to_d1.py --test
          elif [ "${{ github.event.inputs.full_update }}" = "true" ]; then
            python scripts/fetch_to_d1.py --all
          elif [ -n "${{ github.event.inputs.gesetz }}" ]; then
            python scripts/fetch_to_d1.py --gesetz "${{ github.event.inputs.gesetz }}"
          else
            python scripts/fetch_to_d1.py
          fi

      - name: Urteile → D1 laden
        if: ${{ github.event.inputs.mit_urteilen == 'true' }}
        run: python scripts/fetch_openjur.py

      - name: Änderungen committen (lokaler Index)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine lokalen Änderungen."
          else
            git commit -m "chore: Gesetze aktualisiert – $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Zusammenfassung
        run: |
          echo "## Ergebnis" >> $GITHUB_STEP_SUMMARY
          if [ -f data/meta.json ]; then
            ANZAHL=$(python3 -c "import json; d=json.load(open('data/meta.json')); print(d.get('anzahl_eintraege','?'))")
            GESETZE=$(python3 -c "import json; d=json.load(open('data/meta.json')); print(len(d.get('gesetze',[])))")
            echo "- **${ANZAHL}** Paragraphen in **${GESETZE}** Gesetzen in D1 geschrieben" >> $GITHUB_STEP_SUMMARY
          else
            echo "- data/meta.json nicht gefunden" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Abgeschlossen: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
