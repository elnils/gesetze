<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesetze.de – Deutsches Recht</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1a1a18;--ink-2:#4a4a42;--ink-3:#8a8a7a;--paper:#f5f2eb;--paper-2:#ede9de;--paper-3:#e2ddd0;--accent:#c0392b;--gold:#9a7d3a;--border:rgba(26,26,24,.12);--shadow:0 2px 20px rgba(26,26,24,.09);--serif:"Source Serif 4",Georgia,serif;--display:"Playfair Display",serif;--mono:"IBM Plex Mono",monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--serif);background:var(--paper);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.7}
    header{border-bottom:2px solid var(--ink);padding:1.4rem 0 1.2rem;text-align:center;position:relative}
    header::before{content:"";display:block;height:4px;background:var(--accent);position:absolute;top:0;left:0;right:0}
    .eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.4rem}
    h1{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.6rem);font-weight:600;letter-spacing:-.02em}
    h1 span{color:var(--accent)}
    #status{font-family:var(--mono);font-size:.65rem;color:var(--ink-3);margin-top:.3rem}
    main{max-width:860px;margin:0 auto;padding:1.8rem 1.25rem 4rem}
    .sbar{display:flex;align-items:stretch;border:2px solid var(--ink);background:#fff;box-shadow:var(--shadow);transition:border-color .2s;margin-bottom:.6rem}
    .sbar:focus-within{border-color:var(--accent)}
    .sicon{display:flex;align-items:center;padding:0 1rem;font-size:1.2rem;color:var(--ink-3)}
    #qinput{flex:1;padding:.85rem .5rem;font-family:var(--serif);font-size:1rem;border:none;outline:none;background:transparent;color:var(--ink)}
    #qinput::placeholder{color:var(--ink-3);font-style:italic}
    .sactions{display:flex;align-items:center;gap:.3rem;padding:.4rem .5rem}
    .mbtn{padding:.4rem .85rem;font-family:var(--mono);font-size:.72rem;border:1.5px solid var(--border);background:var(--paper-2);cursor:pointer;transition:all .15s;color:var(--ink-2)}
    .mbtn.son{background:var(--gold);color:#fff;border-color:var(--gold)}
    .mbtn.seon{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    #sbtn{padding:.4rem .9rem;font-family:var(--mono);font-size:.72rem;border:none;background:var(--accent);color:#fff;cursor:pointer}
    #sbtn:hover{background:#a93226}
    #sbtn:disabled{opacity:.4;cursor:default}
    .smeta{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);margin-bottom:1.2rem}
    .frow{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.4rem}
    .chip{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;padding:.28rem .75rem;border:1px solid var(--border);background:var(--paper-2);cursor:pointer;transition:all .15s;user-select:none}
    .chip:hover{background:var(--paper-3)}
    .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    #aibox{display:none;border:2px solid var(--gold);background:#fff;margin-bottom:1.5rem;box-shadow:var(--shadow)}
    #aibox.on{display:block}
    .aihead{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:1px solid rgba(154,125,58,.2);background:rgba(154,125,58,.06)}
    .ailabel{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.5rem}
    .ailabel::before{content:"";display:inline-block;width:7px;height:7px;background:var(--gold);border-radius:50%}
    .ailabel.thinking::before{animation:pulse .8s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .aiclear{font-family:var(--mono);font-size:.68rem;background:none;border:1px solid var(--border);padding:.2rem .6rem;cursor:pointer;color:var(--ink-3)}
    .aiclear:hover{background:var(--ink);color:var(--paper)}
    #aimsgs{padding:1rem;max-height:420px;overflow-y:auto}
    .msg{margin-bottom:1rem}
    .msg.user{font-size:.9rem;color:var(--ink-2);font-style:italic;padding:.5rem .8rem;background:var(--paper-2);border-left:3px solid var(--ink-3)}
    .msg.ai{font-size:.93rem;color:var(--ink);line-height:1.75;border-left:3px solid var(--gold);padding:.5rem .8rem;background:rgba(154,125,58,.04)}
    .msg.err{border-left-color:var(--accent)}
    .srcs{margin-top:.7rem;padding-top:.6rem;border-top:1px solid rgba(154,125,58,.2);font-family:var(--mono);font-size:.68rem;color:var(--ink-3)}
    .stag{display:inline-block;margin:.15rem .2rem;padding:.15rem .5rem;background:var(--paper-2);border:1px solid var(--border);cursor:pointer}
    .stag:hover{background:var(--ink);color:var(--paper)}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.4rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ritem{border-top:1px solid var(--border);padding:1.1rem 0;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:.5rem 1rem;transition:all .15s}
    .ritem:hover{background:var(--paper-2);padding-left:.7rem;margin-left:-.7rem}
    .rnorm{font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--accent);white-space:nowrap;padding-top:.1rem}
    .rtitle{font-size:.97rem;color:var(--ink)}
    .rlaw{font-family:var(--mono);font-size:.65rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;grid-column:2}
    .rempty{text-align:center;padding:3.5rem 1rem;color:var(--ink-3)}
    .rempty .big{font-size:2rem;margin-bottom:.5rem}
    .hints{margin-top:1.2rem;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
    .hchip{font-family:var(--mono);font-size:.7rem;padding:.3rem .8rem;border:1px solid var(--border);background:var(--paper-2);cursor:pointer;color:var(--ink-2)}
    .hchip:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
    #panel{display:none;position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:#fff;border-left:2px solid var(--ink);z-index:100;flex-direction:column;box-shadow:-4px 0 32px rgba(26,26,24,.12)}
    #panel.on{display:flex}
    .phead{padding:1.1rem 1.3rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
    .pnorm{font-family:var(--display);font-size:1.4rem;font-weight:600;color:var(--accent)}
    .ptitle{font-size:.9rem;color:var(--ink-2);margin-top:.2rem}
    .pclose{background:none;border:1.5px solid var(--border);padding:.3rem .7rem;cursor:pointer;font-family:var(--mono);font-size:.72rem;color:var(--ink-2)}
    .pclose:hover{background:var(--ink);color:var(--paper)}
    .pbody{flex:1;overflow-y:auto;padding:1.3rem}
    .ptext{font-size:.92rem;line-height:1.85;color:var(--ink);white-space:pre-wrap;border-left:3px solid var(--paper-3);padding-left:1rem;margin-bottom:1rem}
    .paskbtn{width:100%;padding:.6rem;font-family:var(--mono);font-size:.75rem;background:var(--gold);color:#fff;border:none;cursor:pointer}
    .paskbtn:hover{background:#7d6430}
    @media(max-width:600px){#panel{width:100vw;border-left:none;top:auto;height:80vh;border-top:2px solid var(--ink)}}
  </style>
</head>
<body>
<header>
  <div class="eyebrow">Deutsches &amp; Europäisches Recht</div>
  <h1>Gesetze<span>.</span>Repo</h1>
  <div id="status">Lade…</div>
</header>
<main>
  <div style="margin-top:1.6rem">
    <div class="sbar">
      <div class="sicon">⌕</div>
      <input type="text" id="qinput" placeholder="Rechtsfrage stellen oder Paragraph suchen…" autocomplete="off" spellcheck="false">
      <div class="sactions">
        <button class="mbtn" id="mbtn-s" onclick="setMode('s')">Suche</button>
        <button class="mbtn son" id="mbtn-a" onclick="setMode('a')">KI</button>
        <button id="sbtn" onclick="go()">→</button>
      </div>
    </div>
    <div class="smeta"><span id="rcount">–</span> &nbsp; <span id="istats"></span></div>
  </div>
  <div class="frow" id="frow"></div>
  <div id="aibox">
    <div class="aihead">
      <div class="ailabel" id="ailabel">KI-Assistent · Groq</div>
      <button class="aiclear" onclick="clearChat()">✕ Löschen</button>
    </div>
    <div id="aimsgs"></div>
  </div>
  <div id="results">
    <div class="rempty">
      <div class="big">§</div>
      <p>Stelle eine Rechtsfrage oder suche nach Paragraphen.</p>
      <div class="hints">
        <span class="hchip" onclick="ex(this)">Wann hafte ich für Schäden?</span>
        <span class="hchip" onclick="ex(this)">Kündigungsschutz Arbeitnehmer</span>
        <span class="hchip" onclick="ex(this)">§ 823 BGB</span>
        <span class="hchip" onclick="ex(this)">Datenschutz Einwilligung</span>
        <span class="hchip" onclick="ex(this)">GmbH Geschäftsführer Haftung</span>
        <span class="hchip" onclick="ex(this)">Mietminderung Voraussetzungen</span>
      </div>
    </div>
  </div>
</main>
<div id="panel">
  <div class="phead">
    <div><div class="pnorm" id="pnorm">–</div><div class="ptitle" id="ptitle">–</div></div>
    <button class="pclose" onclick="closeP()">✕</button>
  </div>
  <div class="pbody">
    <div class="ptext" id="ptext">Lädt…</div>
    <button class="paskbtn" onclick="askCurrent()">Diese Norm mit KI erklären →</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
const WORKER = "https://ki-gesetze.tageslage.workers.dev";
const MODEL  = "llama-3.3-70b-versatile";
const DATA   = "data/";

let fuse, indexData=[], searchData=[], mode="a", filter=null, history=[], curItem=null;

// ── Laden ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    // index.json (klein, nur Bezeichnung+Titel) und meta.json parallel laden
    const [idxR, metaR] = await Promise.all([
      fetch(DATA+"index.json"),
      fetch(DATA+"meta.json"),
    ]);
    if (!idxR.ok) throw new Error("index.json nicht gefunden");
    indexData = await idxR.json();

    // Fuse.js mit kurzem Index aufbauen
    fuse = new Fuse(indexData, {
      keys:[{name:"b",weight:2.5},{name:"t",weight:1.8},{name:"n",weight:.5}],
      threshold:0.35, includeMatches:true, minMatchCharLength:2,
    });

    const meta = await metaR.json();
    document.getElementById("status").textContent =
      "Stand: " + new Date(meta.generiert).toLocaleDateString("de-DE",
        {day:"2-digit",month:"long",year:"numeric"});
    document.getElementById("istats").textContent =
      `${meta.anzahl_eintraege.toLocaleString("de")} Paragraphen · ${meta.gesetze.length} Gesetze`;
    buildChips(meta.gesetze);
    document.getElementById("rcount").textContent = "Bereit";

    // search.json (mit Inhalt für KI) im Hintergrund nachladen
    fetch(DATA+"search.json").then(r=>r.json()).then(d=>{ searchData=d; });

  } catch(e) {
    document.getElementById("status").textContent = "Fehler: " + e.message;
    console.error(e);
  }
}

// ── Modus ─────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById("mbtn-s").className = "mbtn" + (m==="s"?" seon":"");
  document.getElementById("mbtn-a").className = "mbtn" + (m==="a"?" son":"");
  document.getElementById("qinput").placeholder = m==="a"
    ? "Rechtsfrage stellen… z.B. \"Wann hafte ich als Geschäftsführer?\""
    : "Paragraph suchen… z.B. § 823 oder Kündigung";
  document.getElementById("qinput").focus();
}

function go() {
  const q = document.getElementById("qinput").value.trim();
  if (!q) return;
  mode==="a" ? askAI(q) : doSearch(q);
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("qinput").addEventListener("keydown", e=>{
    if(e.key==="Enter"){e.preventDefault();go();}
    if(e.key==="Escape") closeP();
  });
  document.getElementById("qinput").addEventListener("input", e=>{
    if(mode==="s") doSearch(e.target.value);
  });
});

function ex(el) {
  document.getElementById("qinput").value = el.textContent;
  setMode("a"); askAI(el.textContent);
}

// ── Filter Chips ──────────────────────────────────────────────────────────────
const LABELS={gg:"GG",bgb:"BGB",stgb:"StGB",hgb:"HGB",bdsg_2018:"BDSG",estg:"EStG",uwg:"UWG",gwb:"GWB",urhg:"UrhG"};
function buildChips(gesetze) {
  const prio = Object.keys(LABELS);
  const sorted = [...prio.filter(g=>gesetze.includes(g)), ...gesetze.filter(g=>!prio.includes(g)).sort()];
  document.getElementById("frow").innerHTML = sorted.slice(0,14).map(g=>
    `<button class="chip" onclick="toggleF('${g}',this)">${LABELS[g]||g.toUpperCase()}</button>`
  ).join("");
}
function toggleF(g,el) {
  filter = filter===g ? null : g;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  if(filter) el.classList.add("on");
  const q = document.getElementById("qinput").value.trim();
  if(q||filter) doSearch(q);
}

// ── Suche ─────────────────────────────────────────────────────────────────────
function doSearch(q) {
  if(!fuse) return;
  if(!q&&!filter){showEmpty();return;}
  let res = q
    ? fuse.search(q,{limit:80}).map(r=>r.item)
    : indexData;
  if(filter) res = res.filter(r=>r.g===filter);
  document.getElementById("rcount").textContent = `${res.length} Treffer`;
  document.getElementById("results").innerHTML = res.length
    ? res.slice(0,60).map(item=>`
        <div class="ritem" onclick='openP(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
          <div class="rnorm">${item.b}</div>
          <div>
            <div class="rtitle">${item.t||"<em>–</em>"}</div>
            <div class="rlaw">${item.n||item.g.toUpperCase()}</div>
          </div>
        </div>`).join("")
    : `<div class="rempty"><p>Keine Treffer für <em>${q}</em></p></div>`;
}

function showEmpty() {
  document.getElementById("results").innerHTML=`
    <div class="rempty"><div class="big">§</div>
    <p>Stelle eine Rechtsfrage oder suche nach Paragraphen.</p>
    <div class="hints">
      <span class="hchip" onclick="ex(this)">Wann hafte ich für Schäden?</span>
      <span class="hchip" onclick="ex(this)">Kündigungsschutz Arbeitnehmer</span>
      <span class="hchip" onclick="ex(this)">§ 823 BGB</span>
      <span class="hchip" onclick="ex(this)">Datenschutz Einwilligung</span>
      <span class="hchip" onclick="ex(this)">GmbH Geschäftsführer Haftung</span>
      <span class="hchip" onclick="ex(this)">Mietminderung Voraussetzungen</span>
    </div></div>`;
  document.getElementById("rcount").textContent="–";
}

// ── KI ────────────────────────────────────────────────────────────────────────
function getCtx(q) {
  // Nutze searchData wenn geladen, sonst indexData
  const data = searchData.length ? searchData : indexData;
  if(!data.length) return {text:"",sources:[]};
  const tmp = new Fuse(data, {keys:[{name:"b",weight:2.5},{name:"t",weight:1.8},{name:"i",weight:1}],threshold:0.35});
  const res = tmp.search(q,{limit:5});
  const sources = res.map(r=>r.item);
  const text = sources.map(p=>
    `${p.b} ${p.n} – ${p.t}\n${p.i||""}`
  ).join("\n\n---\n\n");
  return {text, sources};
}

async function askAI(q) {
  const box = document.getElementById("aibox");
  const msgs = document.getElementById("aimsgs");
  const btn = document.getElementById("sbtn");
  const lbl = document.getElementById("ailabel");

  box.classList.add("on");
  btn.disabled=true;
  addMsg(q,"user");
  history.push({role:"user",content:q});

  const {text:ctx, sources} = getCtx(q);
  const sys = `Du bist ein juristischer Assistent für deutsches und europäisches Recht.
Antworte präzise auf Deutsch. Zitiere Normen exakt (z.B. § 823 Abs. 1 BGB).
Weise auf Rechtsunsicherheiten hin. Dies ersetzt keine Rechtsberatung (RDG).
${ctx ? `\nRelevante Normen:\n\n${ctx}` : ""}`;

  lbl.className="ailabel thinking";
  lbl.textContent="KI denkt…";
  const el = addMsg(`<span class="spinner"></span>Analysiere…`,"ai");

  try {
    const r = await fetch(WORKER,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:MODEL, max_tokens:1024, temperature:0.25,
        messages:[{role:"system",content:sys},...history.slice(-6)],
      }),
    });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const ans = d.choices?.[0]?.message?.content || "(keine Antwort)";
    let html = ans.replace(/\n/g,"<br>");
    if(sources.length) {
      html += `<div class="srcs">Normen: ${sources.map(s=>
        `<span class="stag" onclick='openP(${JSON.stringify(s).replace(/'/g,"&#39;")})'>${s.b} ${s.g.toUpperCase()}</span>`
      ).join("")}</div>`;
    }
    el.className="msg ai"; el.innerHTML=html;
    history.push({role:"assistant",content:ans});
    if(fuse) doSearch(q);
  } catch(e) {
    el.className="msg ai err"; el.textContent="Fehler: "+e.message;
  } finally {
    btn.disabled=false;
    lbl.className="ailabel"; lbl.textContent="KI-Assistent · Groq";
    document.getElementById("qinput").value="";
    msgs.scrollTop=msgs.scrollHeight;
  }
}

function addMsg(html,role) {
  const msgs=document.getElementById("aimsgs");
  const el=document.createElement("div");
  el.className=`msg ${role}`; el.innerHTML=html;
  msgs.appendChild(el); msgs.scrollTop=msgs.scrollHeight;
  return el;
}
function clearChat(){history=[];document.getElementById("aimsgs").innerHTML="";document.getElementById("aibox").classList.remove("on");showEmpty();}

// ── Detail Panel ──────────────────────────────────────────────────────────────
async function openP(item) {
  curItem=item;
  document.getElementById("pnorm").textContent=`${item.b} ${item.n||item.g.toUpperCase()}`;
  document.getElementById("ptitle").textContent=item.t||"";
  document.getElementById("ptext").textContent="Lädt…";
  document.getElementById("panel").classList.add("on");

  // Volltext aus data/{gesetz}/data.json laden
  try {
    const r = await fetch(`${DATA}${item.g}/data.json`);
    const d = await r.json();
    const p = d.paragraphen?.find(p=>p.bezeichnung===item.b);
    document.getElementById("ptext").textContent = p?.inhalt || "(kein Volltext)";
  } catch(e) {
    document.getElementById("ptext").textContent = item.i || "(kein Volltext)";
  }
}
function closeP(){document.getElementById("panel").classList.remove("on");curItem=null;}
function askCurrent(){
  if(!curItem) return;
  closeP();
  const q=`Erkläre ${curItem.b} ${curItem.n} – ${curItem.t}`;
  document.getElementById("qinput").value=q;
  setMode("a"); askAI(q);
}

init();
setMode("a");
</script>
</body>
</html>
